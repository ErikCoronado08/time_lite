workflows:
  android-apk:
    name: Compilar Android APK
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Obtener paquetes de Flutter
        script: flutter pub get
      - name: Generar APK Release
        script: flutter build apk --release --android-skip-build-dependency-validation
    artifacts:
      - build/**/outputs/**/*.apk

  ios-build:
    name: Compilar iOS (macOS Cloud)
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Obtener paquetes de Flutter
        script: flutter pub get
      - name: Instalar dependencias de CocoaPods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Compilar proyecto iOS
        script: flutter build ios --release --no-codesign
      - name: Empaquetar IPA para pruebas
        script: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -y TimeLite_iOS.ipa Payload
    artifacts:
      - TimeLite_iOS.ipa
      - build/ios/iphoneos/*.app